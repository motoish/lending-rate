name: Deploy Worker

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "data/**"
      - "lib/**"
      - "public/**"
      - "scripts/**"
      - "test/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "next.config.ts"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - "worker-configuration.d.ts"
      - ".oxfmtrc.json"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/refresh-rates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-lending-rate
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Build
        run: bun run build

      - name: Deploy
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

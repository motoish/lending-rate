name: Refresh Rates

on:
  schedule:
    # GitHub cron uses UTC. 01:00 UTC is 10:00 JST.
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-lending-rates
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Fetch and validate rates
        run: bun run refresh-rates --output /tmp/rates.json

      - name: Download retained trend history
        continue-on-error: true
        run: >
          bunx wrangler kv key get rates:trends:v1
          --binding RATES_KV
          --remote
          --text
          > /tmp/trends-existing.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Fetch and validate trends
        run: >
          bun run refresh-trends
          --existing /tmp/trends-existing.json
          --output /tmp/trends.json

      - name: Upload dated snapshot to KV
        run: |
          SNAPSHOT_DATE="$(bun -e 'console.log((await Bun.file("/tmp/rates.json").json()).updatedAt)')"
          bunx wrangler kv key put "rates:snapshot:${SNAPSHOT_DATE}" --path /tmp/rates.json --binding RATES_KV --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish latest rates to KV
        run: >
          bunx wrangler kv key put rates:latest
          --path /tmp/rates.json
          --binding RATES_KV
          --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish retained trend history to KV
        run: >
          bunx wrangler kv key put rates:trends:v1
          --path /tmp/trends.json
          --binding RATES_KV
          --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
